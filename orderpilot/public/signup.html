<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F5F4E">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<script src="/config.js"></script>
<script src="/assets/brand.js" defer></script>
<title>Créer un compte – OrderPilot</title>
<script src="/assets/auth.js" defer></script>
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <a class="brand" href="/"><img src="/assets/logo.svg" alt=""><span data-brand>OrderPilot</span></a>
    <h1>Créer un compte</h1>
    <p class="muted small">Gratuit, sans carte bancaire. 30 messages analysés par mois.</p>
    <form id="auth-form" data-mode="signup" novalidate>
      <div id="auth-msg" role="alert"></div>
      <div class="field"><label for="storeName">Nom de votre boutique</label><input id="storeName" name="storeName" autocomplete="organization" required maxlength="100"></div>
      <div class="field"><label for="name">Votre prénom</label><input id="name" name="name" autocomplete="given-name" maxlength="100"></div>
      <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required><p class="hint">10 caractères minimum.</p></div>
      <div class="field"><label class="check"><input type="checkbox" name="terms" required> J'ai lu la <a href="/confidentialite" target="_blank">politique de confidentialité</a>.</label></div>
      <button class="btn btn-primary" type="submit">Créer mon compte</button>
    </form>
    <p class="small muted">Déjà inscrit ? <a href="/login">Se connecter</a></p>
  </div>
</main>
</body>
</html>
